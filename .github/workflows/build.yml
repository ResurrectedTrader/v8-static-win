name: Build V8

# Manual: the output only changes when the pinned V8 version does, and a sync
# alone pulls several GB. Consumers download the published assets.
on:
  workflow_dispatch:
    inputs:
      version:
        description: V8 tag, e.g. 15.6.8
        type: string
        required: true
        default: 15.6.8
      configurations:
        description: What to build
        type: choice
        options:
          - x86-release
          - x86-debug
          - x64-release
          - x64-debug
          - x86
          - x64
          - release
          - debug
          - all
        default: x86-release
      runner:
        # A library is only linkable by a toolchain at least as new as the one
        # that built it: MSVC's STL headers call helpers that live in its own
        # libcpmt.lib, so a consumer on an older Visual Studio gets undefined
        # symbols (__std_max_element_* and friends). Building on the older image
        # keeps the artifacts usable by both.
        description: Runner image - windows-2022 (VS 2022) builds artifacts that link on more machines
        type: choice
        options: [windows-2022, windows-latest]
        default: windows-2022
      publish:
        description: Publish the artifacts as a release
        type: boolean
        default: false

jobs:
  # Turning the choice into a matrix needs a job of its own: workflow_dispatch
  # inputs cannot be expanded into `strategy.matrix` directly. It also validates
  # the tag before anything spends a runner on a multi-GB sync.
  plan:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        shell: bash
        run: |
          v='${{ inputs.version }}'
          if [[ ! $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$v' is not a V8 tag (expected e.g. 15.6.8)"
            exit 1
          fi

          case '${{ inputs.configurations }}' in
            all)         want="x86-Release x86-Debug x64-Release x64-Debug" ;;
            x86)         want="x86-Release x86-Debug" ;;
            x64)         want="x64-Release x64-Debug" ;;
            release)     want="x86-Release x64-Release" ;;
            debug)       want="x86-Debug x64-Debug" ;;
            x86-release) want="x86-Release" ;;
            x86-debug)   want="x86-Debug" ;;
            x64-release) want="x64-Release" ;;
            x64-debug)   want="x64-Debug" ;;
          esac

          include=
          for w in $want; do
            include="$include{\"arch\":\"${w%-*}\",\"config\":\"${w#*-}\"},"
          done
          include="[${include%,}]"
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "building: $include"

  build:
    needs: plan
    runs-on: ${{ inputs.runner }}
    # A cold x86 Release run - bootstrap, sync, compile, verify - is ~11 minutes
    # on 32 cores, of which 7 is ninja. A hosted runner has 4 cores, so budget
    # an hour or two. Generous rather than tight: a timeout loses the whole run,
    # and GitHub's hard ceiling is 360 anyway.
    timeout-minutes: 240
    strategy:
      # Each configuration is independent and expensive; one failing should not
      # throw away the others' hours of work.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}

    steps:
      - uses: actions/checkout@v4

      # The build root is outside the workspace; depot_tools and the V8 checkout
      # are large and unrelated to the repo contents.
      # -Verify links and runs a DLL against the result, so a library that
      # archives cleanly but cannot initialise fails here, not in a consumer.
      - name: Build and verify
        shell: pwsh
        run: |
          .\build-v8.ps1 `
            -Root C:\v8b `
            -Version ${{ inputs.version }} `
            -Arch ${{ matrix.arch }} `
            -Config ${{ matrix.config }} `
            -Verify

      # The MSVC toolset goes in the name: it is what decides whether a consumer
      # can link the archive at all, and it is not recoverable from the contents
      # at a glance. The build wrote it to toolset.txt, so the two cannot drift.
      - name: Zip the distribution
        id: zip
        shell: pwsh
        run: |
          $tag  = "${{ matrix.arch }}-$("${{ matrix.config }}".ToLower())"
          $dist = "C:\v8b\dist-$tag"
          if (-not (Test-Path "$dist\v8_monolith.lib")) { throw "no library at $dist" }
          if (-not (Test-Path "$dist\include\v8-gn.h"))  { throw "no v8-gn.h at $dist" }
          if (-not (Test-Path "$dist\toolset.txt"))      { throw "no toolset.txt at $dist" }
          $msvc = (Get-Content "$dist\toolset.txt" -Raw).Trim()
          $name = "v8-${{ inputs.version }}-$tag-msvc$msvc"
          # Not Compress-Archive: it buffers the archive in memory and fails past
          # 2 GB with "Stream was too long", which a Debug monolith comfortably
          # exceeds. The .NET call streams straight to the file and writes Zip64
          # headers when the content needs them.
          $zip = "$env:GITHUB_WORKSPACE\$name.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $dist, $zip, [System.IO.Compression.CompressionLevel]::Optimal, $false)
          "name=$name" >> $env:GITHUB_OUTPUT
          "{0} {1:N0} MB (needs MSVC {2} or newer)" -f "$name.zip", ((Get-Item $zip).Length/1MB), $msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: v8-*.zip
          retention-days: 7
          compression-level: 0   # already a zip
          # Re-running a build for a version already built replaces its artifact
          # rather than failing on the name.
          overwrite: true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.arch }}-${{ matrix.config }}
          # Every log the build writes, not just the compiler's: a failure
          # during the sync happens before build-*.log exists, and uploading
          # nothing is how that failure becomes undiagnosable.
          path: C:\v8b\*.log
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true

  publish:
    needs: build
    # Every configuration has to be green: a release that is missing half its
    # matrix is worse than no release.
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v8-*
          merge-multiple: true
      # Each zip is well under the 2 GiB per-asset limit; a combined archive
      # would not be, so they are published separately.
      # Re-running for a version that already has a release replaces its assets
      # and its notes, rather than failing or leaving a half-updated release.
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la *.zip
          tag="v8-${{ inputs.version }}"

          cat > notes.md <<'EOF'
          Monolithic V8 static libraries built against the static CRT (`/MT`).

          Each archive contains `v8_monolith.lib`, `include/` and a `README.txt`.
          Compile with `/DV8_GN_HEADER` so the public headers pick up the bundled
          `include/v8-gn.h` and lay objects out the way the library does. Link the
          system libraries listed in each archive's `README.txt` alongside it (they
          include `ntdll`, `userenv` and `bcrypt`, which Rust's standard library
          needs), and match the CRT: `/MT` for Release, `/MTd` for Debug. Debug
          keeps MSVC's checked iterators, so it needs no extra defines.

          Temporal is built in; enable it at runtime with `--harmony-temporal`.

          Each configuration was verified by linking a DLL against it, confirming zero
          dynamic-CRT imports, and evaluating both plain JavaScript and a Temporal
          computation through it.
          EOF
          cat >> notes.md <<'EOF'

          The `msvc<x.y>` in each filename is the MSVC toolset the library was built
          with, and it is a **floor, not a match**: link it with that toolset or any
          newer one. An older toolset fails with undefined `__std_*` symbols, because
          MSVC's STL headers call helpers that ship in its own `libcpmt.lib` and each
          release only adds to that set.
          EOF

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "V8 ${{ inputs.version }}" --notes-file notes.md
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber *.zip
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "V8 ${{ inputs.version }}" --notes-file notes.md *.zip
          fi
